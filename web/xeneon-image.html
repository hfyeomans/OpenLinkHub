{{ define "xeneon-image" }}
{{ $root := .Root }}
{{ $widgetArea := .WidgetArea }}
{{ $widget := $widgetArea.Widget }}
<div class="edge-panel media-panel" id="xeneon-image">
    <div class="card system-card"{{ if $widget.BackgroundColor }} style="background: {{ $widget.BackgroundColor }} !important;{{ if $widget.TextColor }} color: {{ $widget.TextColor }} !important;{{ end }}"{{ end }}>
        <div class="card-body">
            <div class="media-frame"{{ if $widget.MediaFile }} data-file="{{ $widget.MediaFile }}"{{ end }}></div>
            <div class="media-placeholder"{{ if $widget.MediaFile }} hidden{{ end }}>{{ $root.Lang "txtNoMediaSelected" }}</div>
        </div>
    </div>
</div>
{{ end }}
