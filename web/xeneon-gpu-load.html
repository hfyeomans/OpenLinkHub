{{ define "xeneon-gpu-load" }}
{{ $root := .Root }}
{{ $widget := .Widget }}
<div class="card system-card thermal-widget gpu-load-widget" id="xeneon-gpu-load-{{ $widget.GpuIndex }}" data-gpu-index="{{ $widget.GpuIndex }}" data-value="0" data-max="{{ $widget.Max }}" data-color="{{ $widget.DataColor }}"{{ if $widget.BackgroundColor }} style="background: {{ $widget.BackgroundColor }} !important;"{{ end }}>
    <div class="card-body">
        <div class="thermal-meta">
            <div class="big-label">{{ $widget.HeaderText }}</div>
        </div>
        <div class="ring-chart">
            <svg viewBox="0 0 120 120" aria-hidden="true">
                <circle class="ring-track" cx="60" cy="60" r="46"></circle>
                <circle class="ring-progress" cx="60" cy="60" r="46"></circle>
            </svg>
            <div class="center">
                <div class="small">
                    <div class="thermal-temp chart-load" style="color: {{ $widget.TextColor }}">0</div>
                </div>
                <div class="big">{{ $widget.Unit }}</div>
            </div>
        </div>
    </div>
</div>
{{ end }}
