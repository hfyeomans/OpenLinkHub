{{ define "xeneon-slideshow" }}
{{ $root := .Root }}
{{ $widgetArea := .WidgetArea }}
{{ $widget := $widgetArea.Widget }}
<div class="edge-panel media-panel" id="xeneon-slideshow" data-interval="{{ $widget.Interval }}">
    <div class="card system-card"{{ if $widget.BackgroundColor }} style="background: {{ $widget.BackgroundColor }} !important;{{ if $widget.TextColor }} color: {{ $widget.TextColor }} !important;{{ end }}"{{ end }}>
        <div class="card-body">
            <div class="media-frame"></div>
            <div class="media-placeholder" hidden>{{ $root.Lang "txtNoMediaFiles" }}</div>
        </div>
    </div>
</div>
{{ end }}
